name: Build exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/const APP_VERSION = 'dev'/const APP_VERSION = '$V'/" app/index.html
          npm version "$V" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run dist
      - run: node scripts/make-html.js
      - uses: actions/upload-artifact@v4
        with:
          name: ST-Card-Creator
          path: dist/ST-Card-Creator.exe
      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ST-Card-Creator.exe
            dist/ST-Card-Creator.html
