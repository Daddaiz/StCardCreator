      - run: npm install
      - run: npm run dist
      - run: node scripts/make-html.js
      - uses: actions/upload-artifact@v4
        with:
          name: ST-Card-Creator
          path: dist/ST-Card-Creator.exe
      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ST-Card-Creator.exe
            dist/ST-Card-Creator.html
